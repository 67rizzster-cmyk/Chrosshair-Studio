name: Build Crosshair Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find or extract project
        shell: powershell
        run: |
          Write-Host "Looking for Crosshair Studio files..."

          $project = Get-ChildItem -Path . -Recurse -Filter "CrosshairStudio.csproj" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($project) {
            Write-Host "Project found: $($project.FullName)"
            exit 0
          }

          $zip = Get-ChildItem -Path . -Recurse -Filter "*.zip" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*Crosshair*" } |
            Select-Object -First 1

          if ($zip) {
            Write-Host "Crosshair ZIP found: $($zip.FullName)"
            Write-Host "Extracting..."

            Expand-Archive -Path $zip.FullName -DestinationPath ".\ExtractedProject" -Force

            Write-Host "Extraction complete."
          }

          $project = Get-ChildItem -Path . -Recurse -Filter "CrosshairStudio.csproj" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $project) {
            Write-Host "Files currently in repository:"
            Get-ChildItem -Path . -Recurse | Select-Object FullName

            Write-Error "CrosshairStudio.csproj could not be found."
            exit 1
          }

          Write-Host "Project found: $($project.FullName)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Crosshair Studio
        shell: powershell
        run: |
          $project = Get-ChildItem -Path . -Recurse -Filter "CrosshairStudio.csproj" |
            Select-Object -First 1

          Write-Host "Building $($project.FullName)"

          msbuild $project.FullName `
            /p:Configuration=Release `
            /p:Platform="Any CPU"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path . -Recurse -Filter "CrosshairStudio.iss" |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "CrosshairStudio.iss was not found."
            exit 1
          }

          Write-Host "Building installer: $($installer.FullName)"

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $installer.FullName

      - name: Find installer
        shell: powershell
        run: |
          $setup = Get-ChildItem -Path . -Recurse -Filter "Crosshair-Studio-Setup.exe" |
            Select-Object -First 1

          if (-not $setup) {
            Write-Error "Installer was not created."
            exit 1
          }

          Write-Host "INSTALLER FOUND:"
          Write-Host $setup.FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Crosshair-Studio-Installer
          path: "**/Crosshair-Studio-Setup.exe"
